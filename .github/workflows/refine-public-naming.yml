name: Final public naming validation pass

on:
  push:
    branches:
      - cleanup-public-naming

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-public-naming
          fetch-depth: 0

      - name: Polish publication-facing terminology
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import re
          import subprocess
          from pathlib import Path

          root = Path('.')
          workflow_rel = '.github/workflows/refine-public-naming.yml'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')

          # Remaining numbered legacy-stage forms, including line-wrapped forms.
          stage_replacements = [
              (r'(?i)\bStage\s+2B\b', 'pre-model protocol'),
              (r'(?i)\bStage\s+2\b', 'data-quality protocol'),
              (r'(?i)\bStage\s+3\b', 'development analysis'),
              (r'(?i)\bStage\s+4\b', 'robustness analysis'),
              (r'(?i)\bPROMPT\s*2B\b', 'pre-model protocol'),
              (r'(?i)\bPROMPT\s*2\b', 'data-quality protocol'),
              (r'(?i)\bPROMPT\s*3\b', 'development analysis'),
              (r'(?i)\bPROMPT\s*4\b', 'robustness analysis'),
          ]

          exact = {
              # Clean mechanically duplicated wording in module documentation/reports.
              '"""Reproducible development analysis development analysis.': '"""Reproducible development analysis.',
              '"""Runtime helpers for the development analysis development analysis.': '"""Runtime helpers for the development analysis.',
              '"""robustness analysis frozen-model robustness, reliability, and freeze analysis.': '"""Frozen-model robustness, reliability, and freeze analysis.',
              'This runner deliberately uses only the development analysis development pool.  It does': 'This runner deliberately uses only the development pool.  It does',
              'The development analysis selected configuration is reused': 'The selected development configuration is reused',
              'The development analysis development pool contains': 'The development pool contains',
              'development analysis completed the authorized development analysis': 'The development analysis was completed',
              '# development analysis Master Model Development Report': '# Model Development Master Report',
              '# development analysis analytic dataset reconstruction': '# Development analytic dataset reconstruction',
              '# development analysis complaint grouping': '# Development complaint grouping',
              '# development analysis validation execution plan': '# Development validation execution plan',
              '# development analysis model-tuning protocol': '# Development model-tuning protocol',
              '# development analysis model-selection policy': '# Development model-selection policy',
              '# development analysis model-tuning execution': '# Development model-tuning execution',
              'title="development analysis internal precision-recall curves"': 'title="Development internal precision-recall curves"',
              'title="development analysis internal ROC curves"': 'title="Development internal ROC curves"',
              'development analysis completed at': 'Development analysis completed at',
              'development analysis finalization complete': 'Development analysis finalization complete',
              'development analysis start;': 'Development analysis start;',
              'development analysis complete;': 'Development analysis complete;',
              '# robustness analysis Master Robustness and Freeze Report': '# Robustness and Freeze Master Report',
              'robustness analysis challenged the frozen development analysis candidate': 'The robustness analysis challenged the frozen development candidate',
              'The exact development analysis XGBoost/Feature Set C configuration': 'The frozen development XGBoost/Feature Set C configuration',
              'The challenge reused the frozen development analysis configurations on the same robustness analysis repeated five-fold partitions.': 'The challenge reused the frozen development configurations on the same repeated five-fold robustness partitions.',
              'The same frozen XGBoost configuration was evaluated on identical robustness analysis folds.': 'The same frozen XGBoost configuration was evaluated on identical robustness folds.',
              'development analysis classified missingness indicators': 'Development analysis classified missingness indicators',
              'title="robustness analysis calibration stress test"': 'title="Robustness calibration stress test"',
              'title="robustness analysis PR stability across repeated folds"': 'title="Robustness PR stability across repeated folds"',
              'title="robustness analysis alert-budget robustness"': 'title="Alert-budget robustness"',
              'title="robustness analysis decision curve analysis"': 'title="Robustness decision curve analysis"',
              'title="robustness analysis subgroup reliability (descriptive)"': 'title="Subgroup reliability (descriptive)"',
              'No post-hoc recalibration was fitted in robustness analysis. the development-analysis nested sigmoid comparison did not materially improve Brier, so the final policy remains no recalibration.': 'No post-hoc recalibration was fitted during the robustness analysis. The nested sigmoid comparison performed during development did not materially improve Brier, so the final policy remains no recalibration.',
              'Stage 1/2 reported zero exact duplicate rows and zero duplicate feature vectors': 'Earlier data-audit stages reported zero exact duplicate rows and zero duplicate feature vectors',
              'reason: development analysis nested sigmoid calibration did not materially improve Brier; robustness analysis\n  evaluates raw frozen probabilities': 'reason: nested sigmoid calibration evaluated during development did not materially improve Brier;\n  the frozen model therefore uses raw probabilities without recalibration',
              '"reason": "development analysis nested sigmoid calibration did not materially improve Brier; robustness analysis evaluates raw frozen probabilities"': '"reason": "nested sigmoid calibration evaluated during development did not materially improve Brier; the frozen model therefore uses raw probabilities without recalibration"',
              'development_reference: robustness analysis pooled OOF development estimates only; not a threshold\n  calibration': 'development_reference: pooled OOF development estimates from the robustness analysis; not a threshold\n  calibration',
              '"development_reference": "robustness analysis pooled OOF development estimates only; not a threshold calibration"': '"development_reference": "pooled OOF development estimates from the robustness analysis; not a threshold calibration"',
              '## 26. Exact Stage 5 instructions': '## 26. Exact held-out evaluation instructions',
              'Stage 5 may run exactly once on `1404-2`': 'The held-out evaluation may run exactly once on `1404-2`',
              '"prompt5_allowed": True': '"heldout_evaluation_allowed": True',
              '# robustness analysis execution boundary': '# Robustness analysis execution boundary',
              'All robustness analysis model calculations': 'All robustness-analysis model calculations',
              '# Copy the already fitted development analysis development pipeline as the frozen': '# Copy the already fitted development pipeline as the frozen',
              '# robustness analysis reference;': '# robustness reference;',
              'robustness analysis finalization complete': 'Robustness analysis finalization complete',
              'robustness analysis start:': 'Robustness analysis start:',
              'robustness analysis complete:': 'Robustness analysis complete:',
              'The exact development analysis XGBoost/Feature Set C': 'The frozen development XGBoost/Feature Set C',
              'best non-XGBoost development analysis candidate': 'best non-XGBoost development candidate',
              'robustness analysis classification is': 'robustness-analysis classification is',
              'robustness analysis effect is': 'robustness-analysis effect is',
              'robustness analysis recommendation:': 'Robustness-analysis recommendation:',
              'If continued, robustness analysis must focus': 'If continued, the robustness analysis must focus',
          }

          for rel in tracked:
              if not rel or rel == workflow_rel:
                  continue
              path = root / rel
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for pattern, repl in stage_replacements:
                  text = re.sub(pattern, repl, text)
              for old, new in exact.items():
                  text = text.replace(old, new)

              # Remove the old shorthand used in generated development table names.
              text = re.sub(r'table_P3-(\d+)_', r'table_dev_\1_', text)
              text = re.sub(r'Table P3-(\d+)', r'Development Table \1', text)

              # Old module alias P3 survived the filename rename in robustness code.
              if rel == 'src/modeling/robustness_analysis.py':
                  text = re.sub(r'\bP3\b', 'DEV', text)

              # Capitalize report prose where a mechanical replacement became a sentence start.
              text = re.sub(r'(?m)^(development analysis)(?=\s)', 'Development analysis', text)
              text = re.sub(r'(?m)^(robustness analysis)(?=\s)', 'Robustness analysis', text)
              text = text.replace('# development analysis ', '# Development ')
              text = text.replace('# robustness analysis ', '# Robustness ')

              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Remove this one-time workflow from the resulting commit.
          workflow = root / workflow_rel
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate cleaned public tree
        shell: bash
        run: |
          python -m compileall -q src scripts tests
          python -m pip install --quiet pytest pyyaml
          pytest -q
          git diff --check
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          root = Path('.')
          checks = {
              'legacy_prompt': re.compile(r'(?i)\bprompt\w*'),
              'numbered_stage': re.compile(r'(?i)\bstage\s*(?:1(?:/2)?|2b|2|3|4|5)\b'),
              'legacy_p3': re.compile(r'(?<![A-Za-z0-9_])P3(?:\b|-)'),
              'ai_marker': re.compile(r'(?i)\b(?:openai|chatgpt|codex)\b|ai-assisted'),
              'duplicated_phrase': re.compile(r'(?i)\bdevelopment analysis development\b|\brobustness analysis robustness\b'),
          }
          offenders = {key: [] for key in checks}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for rel in tracked:
              if not rel:
                  continue
              path = root / rel
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              haystack = rel + '\n' + text
              for key, pattern in checks.items():
                  if pattern.search(haystack):
                      offenders[key].append(rel)
          bad = {k: v for k, v in offenders.items() if v}
          if bad:
              raise SystemExit(f'Public naming audit failed: {bad}')

          # Frozen scientific reference results must remain byte-for-byte identical to main.
          main_bytes = subprocess.check_output(['git', 'show', 'origin/main:results/expected_results.json'])
          branch_bytes = (root / 'results' / 'expected_results.json').read_bytes()
          if hashlib.sha256(main_bytes).digest() != hashlib.sha256(branch_bytes).digest():
              raise SystemExit('Frozen scientific reference results differ from main; aborting.')
          print('Public naming audit passed; frozen reference results unchanged.')
          PY

      - name: Commit final cleaned tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No refinement changes to commit.'
            exit 0
          fi
          git commit -m 'chore: finalize publication-facing repository naming'
          git push origin HEAD:cleanup-public-naming
